name: parity
on: [push, pull_request]
permissions:
  contents: read
jobs:
  parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Python normalizer and classifier tests
        run: python -m unittest discover -s py -p "test_*.py" -v
      - name: Browser vs Python classification parity on golden cases
        run: python py/parity_check.py
